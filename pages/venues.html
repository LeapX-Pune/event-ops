<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Global Venues | Conclave</title>
    <meta name="description" content="Discover elite experiences mapped across the globe."/>
    <link rel="stylesheet" href="../css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100;200;300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script src="https://unpkg.com/three"></script>
    <script src="https://unpkg.com/globe.gl"></script>
    <style>
        body {
            overflow: hidden; /* Prevent scrolling for immersive full-screen */
            background: #000;
        }

        #globe-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        /* ═══ Geolocation Prompt Overlay ═══ */
        #geo-prompt {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(10, 10, 18, 0.8);
            backdrop-filter: blur(20px);
            transition: opacity 0.8s ease, visibility 0.8s;
        }
        
        #geo-prompt.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .geo-card {
            background: rgba(22, 22, 42, 0.7);
            border: 1px solid var(--gold);
            padding: 48px;
            border-radius: 20px;
            text-align: center;
            max-width: 460px;
            box-shadow: 0 0 60px rgba(230, 198, 135, 0.15);
        }

        /* ═══ Custom HTML Markers ═══ */
        .globe-marker {
            width: 24px;
            height: 24px;
            transform: translate(-50%, -50%); /* Center on coordinate */
            cursor: pointer;
            position: relative;
            pointer-events: auto;
        }

        .marker-pulse {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 50%;
            background: var(--gold);
            opacity: 0.8;
            animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }

        .marker-core {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 8px; height: 8px;
            background: white;
            border-radius: 50%;
            box-shadow: 0 0 10px var(--gold);
        }

        @keyframes pulse-ring {
            0% { transform: scale(0.5); opacity: 1; }
            100% { transform: scale(3); opacity: 0; }
        }

        /* ═══ Hover Popup ═══ */
        .marker-popup {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: rgba(15, 15, 25, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-medium);
            padding: 20px;
            border-radius: 12px;
            width: 260px;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: left;
        }

        .globe-marker:hover .marker-popup {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
            pointer-events: auto;
        }

        .marker-popup::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 50%;
            transform: translateX(-50%) rotate(45deg);
            width: 12px;
            height: 12px;
            background: rgba(15, 15, 25, 0.85);
            border-right: 1px solid var(--border-medium);
            border-bottom: 1px solid var(--border-medium);
        }

        /* Top Bar Overlay */
        .venues-overlay-title {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            text-align: center;
            pointer-events: none;
        }

    </style>
</head>
<body>

    <!-- ═══ Navigation ═══ -->
    <nav class="nav scrolled" style="background: transparent; border: none;">
        <div class="nav-inner">
            <a href="../index.html" class="nav-brand">CONCLAVE</a>
            <div class="nav-links">
                <a class="nav-link" href="events.html">Events</a>
                <a class="nav-link active" href="venues.html">Venues</a>
                <a class="nav-link" href="bookings.html">My Bookings</a>
            </div>
            <div class="nav-actions">
                <a href="bookings.html" class="nav-avatar" style="display: flex; align-items: center; justify-content: center; color: var(--text-secondary); text-decoration: none;">
                    <span class="material-symbols-outlined" style="font-size: 24px;">person</span>
                </a>
            </div>
        </div>
    </nav>

    <!-- (Geo prompt removed, loaded from localStorage) -->

    <!-- ═══ 3D Globe Container ═══ -->
    <div id="globe-container"></div>

    <div class="venues-overlay-title reveal" style="animation-delay: 1s;">
        <span class="section-label" style="display:block; text-shadow: 0 2px 10px rgba(0,0,0,0.8);">Global Network</span>
    </div>

    <!-- ═══ Scripts ═══ -->
    <!-- Note: Data file must be loaded first -->
    <script type="module" src="../js/events-data.js"></script>
    <script src="../js/animations.js"></script>
    <script src="../js/sidebar.js"></script>
    <script src="../js/venues-globe.js"></script>

</body>
</html>
